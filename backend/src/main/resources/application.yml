spring:
  application:
    name: hilaz-hanger-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/hilaz_hanger}
    username: ${SPRING_DATASOURCE_USERNAME:hilaz}
    password: ${SPRING_DATASOURCE_PASSWORD:hilaz_secret}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  mail:
    host: ${SPRING_MAIL_HOST:}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 8080
  servlet:
    context-path: /api

app:
  jwt:
    secret: ${JWT_SECRET:change-this-to-a-long-random-secret-key-in-production-min-256-bits}
    expiration-ms: 86400000
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200,https://hilaz-hanger.vercel.app}
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    api-key: ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}
  razorpay:
    key-id: ${RAZORPAY_KEY_ID:}
    key-secret: ${RAZORPAY_KEY_SECRET:}
    webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}
  frontend:
    url: ${APP_FRONTEND_URL:https://hilaz-hanger.vercel.app}
  gst:
    rate-percent: ${APP_GST_RATE_PERCENT:18}
  store:
    name: ${APP_STORE_NAME:Hilaz Hanger}
    gstin: ${APP_STORE_GSTIN:}
    address: ${APP_STORE_ADDRESS:Coimbatore, Tamil Nadu, India}
  mail:
    enabled: ${APP_MAIL_ENABLED:false}
    from: ${APP_MAIL_FROM:noreply@hilazhanger.com}
  sms:
    enabled: ${APP_SMS_ENABLED:false}
    twilio-account-sid: ${TWILIO_ACCOUNT_SID:}
    twilio-auth-token: ${TWILIO_AUTH_TOKEN:}
    twilio-from: ${TWILIO_FROM_PHONE:}
