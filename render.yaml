# Render Blueprint — deploy DB + API together
# Dashboard: New > Blueprint > connect GitHub repo (root = this folder)
services:
  - type: web
    name: hilaz-hanger-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    rootDir: backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DATABASE_URL
        fromDatabase:
          name: hilaz-hanger-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: APP_CORS_ALLOWED_ORIGINS
        value: http://localhost:4200

databases:
  - name: hilaz-hanger-db
    plan: free
    databaseName: hilaz_hanger
    user: hilaz
